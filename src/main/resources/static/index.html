<!DOCTYPE html>
<html>
<head>
    <title>Todo Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .form-container {
            width: 400px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h1>My Todo Application</h1>

<!-- FORM -->
<div class="form-container">

    <h2>Add Todo</h2>

    <form id="todoForm">

        <label>Title</label>
        <input
            type="text"
            id="title"
            placeholder="Enter title"
            required
        >

        <label>Description</label>
        <input
            type="text"
            id="description"
            placeholder="Enter description"
            required
        >

        <label>
            <input type="checkbox" id="complete">
            Completed
        </label>

        <br>

        <button type="submit">Add Todo</button>

    </form>

</div>


<!-- TODO TABLE -->

<h2 style="text-align:center;">Todo List</h2>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Complete</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="todoTable">
    </tbody>

</table>


<script>

const form = document.getElementById("todoForm");


// ADD TODO
form.addEventListener("submit", function(event) {

    event.preventDefault();

    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const complete = document.getElementById("complete").checked;

    const todo = {
        title: title,
        description: description,
        complete: complete
    };

    fetch("/todos", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(todo)

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to add todo");
        }

        return response.json();

    })

    .then(data => {

        alert("Todo added successfully!");

        form.reset();

        loadTodos();

    })

    .catch(error => {

        console.error(error);

        alert("Error adding todo");

    });

});


// GET ALL TODOS

function loadTodos() {

    fetch("/todos")

        .then(response => response.json())

        .then(todos => {

            const table = document.getElementById("todoTable");

            table.innerHTML = "";

            todos.forEach(todo => {

                const row = `
                    <tr>

                        <td>${todo.id}</td>

                        <td>${todo.title}</td>

                        <td>${todo.description}</td>

                        <td>${todo.complete}</td>

                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteTodo(${todo.id})">
                                Delete
                            </button>
                        </td>

                    </tr>
                `;

                table.innerHTML += row;

            });

        })

        .catch(error => {

            console.error(error);

        });
}


// DELETE TODO

function deleteTodo(id) {

    if (!confirm("Are you sure you want to delete this todo?")) {
        return;
    }

    fetch("/todos/" + id, {

        method: "DELETE"

    })

    .then(response => {

        if (response.ok) {

            alert("Todo deleted!");

            loadTodos();

        }

    });

}


// LOAD TODOS WHEN PAGE OPENS

loadTodos();

</script>

</body>
</html>
